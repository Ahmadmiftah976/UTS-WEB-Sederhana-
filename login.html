<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk – LaporKi' Sistem Pengaduan Masyarakat</title>
  <meta name="description" content="Masuk ke akun LaporKi' Anda untuk membuat atau memantau laporan pengaduan masyarakat." />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="login-page">
  <div class="login-card" id="loginCard">

    <!-- Logo -->
    <div class="login-logo">
      <div class="logo-icon"><i class="bi bi-megaphone-fill"></i></div>
      <h4>LaporKi'</h4>
      <p>Sistem Pengaduan Masyarakat Digital</p>
    </div>

    <!-- Role Label -->
    <div class="login-role-label">
      <i class="bi bi-person-fill"></i> Login Masyarakat
    </div>

    <!-- Form Login -->
    <form id="loginForm" novalidate>
      <div class="mb-4">
        <label class="form-label-custom" for="inputEmail">
          <i class="bi bi-envelope me-1" style="color:var(--primary);"></i> Alamat Email
        </label>
        <input type="email" class="form-control-custom" id="inputEmail"
               placeholder="contoh@email.com" autocomplete="email" />
        <div class="invalid-feedback-custom" id="errEmail">Email tidak valid atau masih kosong.</div>
      </div>

      <div class="mb-1">
        <label class="form-label-custom" for="inputPassword">
          <i class="bi bi-lock-fill me-1" style="color:var(--primary);"></i> Kata Sandi
        </label>
        <div style="position:relative;">
          <input type="password" class="form-control-custom" id="inputPassword"
                 placeholder="Masukkan kata sandi" autocomplete="current-password"
                 style="padding-right:2.8rem;" />
          <button type="button" id="btnTogglePass"
                  style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-light);cursor:pointer;font-size:1rem;padding:0;"
                  onclick="togglePassword()">
            <i class="bi bi-eye" id="iconEye"></i>
          </button>
        </div>
        <div class="invalid-feedback-custom" id="errPassword">Kata sandi tidak boleh kosong.</div>
      </div>

      <div class="d-flex justify-content-end mb-4">
        <a href="#" style="font-size:.82rem;">Lupa kata sandi?</a>
      </div>



      <button type="submit" class="btn-primary-custom w-100 justify-content-center" id="btnLogin"
              style="padding:.8rem;font-size:.95rem;">
        <i class="bi bi-box-arrow-in-right" id="loginIcon"></i>
        <span id="loginText">Masuk</span>
      </button>
    </form>



    <div class="text-center mt-3">
      <a href="index.html" style="font-size:.82rem;color:var(--text-light);">
        <i class="bi bi-arrow-left me-1"></i>Kembali ke Beranda
      </a>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container-custom" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
